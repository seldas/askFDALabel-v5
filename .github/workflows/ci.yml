name: CI Quality & Security Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Secret & Sensitive Info Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan (Filesystem)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Custom Compliance Pattern Scan
        run: |
          echo "Scanning for internal domain names and hardcoded credentials..."
          # Match forbidden strings without writing the plain literals in this yaml file
          P1=$(echo "bmNzaHBjZ3B1MDEuZmRhLmdvdg==" | base64 -d)
          P2=$(echo "bmNzdk1zY2lkZXZsMDMuZmRhLmdvdg==" | base64 -d)
          P3=$(echo "MTk4NjQxNA==" | base64 -d)
          P4=$(echo "ZGVwbG95L2RhdGFfdHJhbnNmZXIvTWVkRFJBX2xhdGVzdA==" | base64 -d)

          FORBIDDEN_PATTERNS=("$P1" "$P2" "$P3" "$P4")
          FAIL=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(grep -rnF "$pattern" . \
              --exclude-dir={.git,node_modules,.next,venv,__pycache__} || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Found forbidden internal pattern/credential: '$pattern'"
              echo "$MATCHES"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "Security compliance check failed. Please remove the above internal references or sensitive strings."
            exit 1
          fi
          echo "No forbidden internal patterns found."

  backend-check:
    name: Backend Syntax & Imports Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python Syntax Across Repository
        run: |
          python -m compileall -q backend/ deploy/

  frontend-check:
    name: Frontend TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: npm run lint
