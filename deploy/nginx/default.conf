# Helper to decide if we should redirect to HTTPS
map "$http_x_forwarded_proto:$host" $should_redirect {
    "~^https:.*$" 0;
    "~^http:.*\.trycloudflare\.com$" 0;
    "~^http:.*$" 1;
    default 1;
}

# WebSocket support map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Saving a query as a task POSTs the result rows themselves, which is ~1.5 MB
    # at the 3,000-row cap -- past nginx's 1 MB default.
    client_max_body_size 16m;

    location ^~ /fdalabel-v3_api/ {
        if ($should_redirect) {
            return 301 https://$host$request_uri;
        }
        
        rewrite ^/fdalabel-v3_api/(.*)$ /$1 break;
        proxy_pass http://backend:8842;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /fdalabel-v3_api;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_read_timeout 600s;
        proxy_connect_timeout 75s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location ^~ /fdalabel-v3 {
        if ($should_redirect) {
            return 301 https://$host$request_uri;
        }

        proxy_pass http://frontend:8841;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /fdalabel-v3;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_read_timeout 300s;
    }

    location = / {
        if ($should_redirect) {
            return 301 https://$host$request_uri;
        }
        return 302 /fdalabel-v3/;
    }

    location / {
        if ($should_redirect) {
            return 301 https://$host$request_uri;
        }
        return 302 /fdalabel-v3/;
    }
}

include /etc/nginx/conf.d/ssl.conf;
