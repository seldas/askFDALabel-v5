# Helper to decide if we should redirect to HTTPS
map "$http_x_forwarded_proto:$host" $should_redirect {
    "~^https:.*$" 0;
    "~^http:.*\.trycloudflare\.com$" 0;
    "~^http:.*$" 1;
    default 1;
}
# WebSocket support map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TLS may terminate at the HPC/pre-prod upstream proxy.
map $http_x_forwarded_proto $sso_proxy_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Saving a query as a task POSTs the result rows themselves, which is ~1.5 MB
    # at the 3,000-row cap -- past nginx's 1 MB default.
    client_max_body_size 16m;

    # Test SAML IdP (removed from rapid-generated configurations).
    location ^~ /sso/ {
        if ($should_redirect) {
            return 301 https://$http_host$request_uri;
        }
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $sso_proxy_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # End test SAML IdP

    # FDA_ACS_ROUTE

    location ^~ /fdalabel-v3_api/ {
        if ($should_redirect) {
            return 301 https://$http_host$request_uri;
        }
        
        rewrite ^/fdalabel-v3_api/(.*)$ /$1 break;
        proxy_pass http://backend:8842;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $sso_proxy_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /fdalabel-v3_api;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_read_timeout 600s;
        proxy_connect_timeout 75s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location ^~ /fdalabel-v3 {
        if ($should_redirect) {
            return 301 https://$http_host$request_uri;
        }

        proxy_pass http://frontend:8841;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $sso_proxy_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /fdalabel-v3;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_read_timeout 300s;
    }

    location = / {
        if ($should_redirect) {
            return 301 https://$http_host$request_uri;
        }
        return 302 /fdalabel-v3/;
    }

    location / {
        if ($should_redirect) {
            return 301 https://$http_host$request_uri;
        }
        return 302 /fdalabel-v3/;
    }
}
